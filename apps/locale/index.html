        body {
            font-family: Arial, sans-serif;
            background: #fff;
            color: #333;
            margin: 0;
            line-height: 1.55;
        }
        .wrap {
            max-width: 40rem;
            margin: 0 auto;
            padding: 48px 24px 72px;
        }
        h1 {
            margin: 28px 0 8px;
            font-size: 28px;
            font-weight: 600;
            color: #222;
        }
        a { color: #1a5f9e; text-decoration: underline; }
        .sample { color: #666; font-size: 14px; margin: 0; }
        #sample-line { margin: 0 0 4px; }
        #written-line { margin: 0 0 28px; }
        label {
            display: block;
            color: #222;
            font-weight: 600;
        }
        input, select {
            font: inherit;
            color: #333;
            background: #fff;
            width: 100%;
            box-sizing: border-box;
            margin: 8px 0 12px;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        select { margin-bottom: 0; cursor: pointer; }
        button {
            font: inherit;
            color: #fff;
            background: #1a5f9e;
            border: 0;
            border-radius: 4px;
            min-height: 44px;
            padding: 8px 16px;
            cursor: pointer;
        }
        button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid #2f6fad;
            outline-offset: 2px;
        }
        #out { margin-top: 28px; }
        .card { margin: 0 0 28px; }
        .card h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: #222;
        }
        dl { margin: 0; }
        dt {
            margin-top: 10px;
            color: #666;
            font-size: 13px;
        }
        dd { margin: 0; color: #222; }
        .miss { margin: 0; color: #333; }
        @media (max-width: 760px) {
            button { width: 100%; }
        }
    </style>

                } catch (e) {
                    var day = new Intl.DateTimeFormat(tag, { dateStyle: "full", timeZone: "UTC" }).format(SAMPLE);
                    var clock = new Intl.DateTimeFormat(tag, { timeStyle: "long", timeZone: "UTC" }).format(SAMPLE);
                    when = day + " " + clock;
                }
                return when + " · " + new Intl.NumberFormat(tag).format(AMOUNT);
            }

            function el(tag, className, text) {
                var node = document.createElement(tag);
                if (className) node.className = className;
                if (text != null) node.textContent = text;
                return node;
            }

            function addRow(dl, label, value, ltr) {
                dl.appendChild(el("dt", "", label));
                var dd = el("dd");
                var island = el("bdi", "", value);
                if (ltr) island.dir = "ltr";
                dd.appendChild(island);
                dl.appendChild(dd);
            }

            function card(base) {
                var loc = recognize(base);
                var article = el("article", "card");
                var heading = el("h2");
                heading.appendChild(el("bdi", "", loc ? loc.baseName : base));
                heading.firstChild.dir = "ltr";
                article.appendChild(heading);
                if (!loc) {
                    article.appendChild(el("p", "miss", t("notRecognized")));
                    return article;
                }
                var chain = parentsOf(loc.baseName);
                var dates = datesOf(loc.baseName);
                var money = currencyOf(loc);
                var english = safeName("en", loc.baseName);
                var native = safeName(loc.baseName, loc.baseName);
                var inUi = safeName(uiTag, loc.baseName);
                var dl = el("dl");
                if (inUi && inUi !== english && inUi !== native) addRow(dl, t("name"), inUi, false);
                addRow(dl, t("english"), english, false);
                addRow(dl, t("native"), native, false);
                addRow(dl, t("parents"), chain.length ? chain.join(" → ") : t("none"), !!chain.length);
                addRow(dl, t("longDate"), dates.longDate, false);
                addRow(dl, t("shortDate"), dates.shortDate, false);
                addRow(dl, t("longTime"), dates.longTime, false);
                if (money) {
                    addRow(dl, t("currencyCode"), money.iso, true);
                    addRow(dl, t("currencySymbol"), money.symbol, false);
                    addRow(dl, t("amount"), money.amount, false);
                } else {
                    addRow(dl, t("currency"), t("noCurrency"), false);
                }
                article.appendChild(dl);
                return article;
            }

            var out = document.getElementById("out");
            var sampleLine = document.getElementById("sample-line");
            var writtenLine = document.getElementById("written-line");
            var uiSelect = document.getElementById("ui");
            var followOpt = el("option", "", "");
            followOpt.value = "";
            uiSelect.appendChild(followOpt);
            AVAILABLE.forEach(function (code) {
                var opt = el("option");
                opt.value = code;
                var native = safeName(code, code);
                opt.textContent = native && native !== code ? native + " · " + code : code;
                uiSelect.appendChild(opt);
            });

            function showMiss(text) {
                out.textContent = "";
                out.appendChild(el("p", "miss", text));
            }

            function show(input) {
                var code = asCode(input);
                if (code) {
                    var loc = recognize(code);
                    out.textContent = "";
                    if (!loc) {
                        showMiss(t("notRecognized"));
                        return;
                    }
                    out.appendChild(card(loc.baseName));
                    return;
                }
                var hits = searchNames(input);
                out.textContent = "";
                if (!hits.length) {
                    showMiss(t("noEntry"));
                    return;
                }
                hits.forEach(function (hit) { out.appendChild(card(hit)); });
            }

            function setLine(node, key, token, value, dir) {
                node.textContent = "";
                var parts = t(key).split("{" + token + "}");
                node.appendChild(document.createTextNode(parts[0] || ""));
                var island = el("bdi", "", value);
                island.dir = dir;
                node.appendChild(island);
                if (parts.length > 1) node.appendChild(document.createTextNode(parts.slice(1).join("{" + token + "}")));
            }

            function applyChrome() {
                var root = document.documentElement;
                root.lang = uiTag;
                root.dir = textDir(uiTag);
                document.title = t("title");
                document.querySelectorAll("[data-msg]").forEach(function (node) {
                    node.textContent = t(node.getAttribute("data-msg"));
                });
                followOpt.textContent = t("follow");
                uiSelect.value = pref;
                setLine(sampleLine, "sample", "fixed", FIXED, "ltr");
                setLine(writtenLine, "written", "local", localSample(uiTag), "auto");
            }

            function canonAvailable(tag) {
                if (!tag) return "";
                var loc = recognize(tag);
                if (!loc) return "";
                return AVAILABLE.indexOf(loc.baseName) === -1 ? "" : loc.baseName;
            }

            function resolveBrowser() {
                var list = [];
                if (navigator.languages) {
                    for (var i = 0; i < navigator.languages.length; i++) list.push(navigator.languages[i]);
                }
                if (navigator.language) list.push(navigator.language);
                for (var j = 0; j < list.length; j++) {
                    var loc = recognize(list[j]);
                    if (loc) return loc.baseName;
                }
                return "en";
            }

            function readStored() {
                try { return localStorage.getItem(STORE); }
                catch (e) { return null; }
            }

            function writeStored(value) {
                try {
                    if (value) localStorage.setItem(STORE, value);
                    else localStorage.removeItem(STORE);
                } catch (e) { /* private mode */ }
            }

            function writeLangParam(tag) {
                try {
                    var url = new URL(location.href);
                    if (tag) url.searchParams.set("lang", tag);
                    else url.searchParams.delete("lang");
                    history.replaceState(null, "", url.pathname + url.search + url.hash);
                } catch (e) { /* leave the address */ }
            }

            function readLangParam() {
                try { return new URL(location.href).searchParams.get("lang"); }
                catch (e) { return null; }
            }

            var param = readLangParam();
            var fromUrl = param ? canonAvailable(param) : "";
            if (fromUrl) {
                pref = fromUrl;
                if (param !== fromUrl) writeLangParam(fromUrl);
            } else {
                if (param) writeLangParam("");
                var stored = readStored();
                var fromStore = stored ? canonAvailable(stored) : "";
                if (fromStore) pref = fromStore;
            }
            uiTag = pref || resolveBrowser();
            applyChrome();

            uiSelect.addEventListener("change", function () {
                var next = uiSelect.value ? canonAvailable(uiSelect.value) : "";
                if (uiSelect.value && !next) {
                    uiSelect.value = pref;
                    return;
                }
                pref = next;
                uiTag = pref || resolveBrowser();
                nameCache = null;
                nameCacheTag = "";
                writeStored(pref);
                writeLangParam(pref);
                applyChrome();
                if (lastQuery) show(lastQuery);
            });

            document.getElementById("lookup").addEventListener("submit", function (event) {
                event.preventDefault();
                var input = document.getElementById("q").value.trim();
                lastQuery = input;
                if (!input) {
                    out.textContent = "";
                    return;
                }
                show(input);
            });
        })();
    </script>
